<!doctype html><meta charset="utf-8"><title>Native container test</title>
<p id="status">Testing generic offline web container</p>
<script>
(async()=>{
 try{
  const db=await new Promise((ok,no)=>{const r=indexedDB.open('container-smoke',1);r.onupgradeneeded=()=>r.result.createObjectStore('values');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  const stored=await new Promise((ok,no)=>{const t=db.transaction('values','readonly'),r=t.objectStore('values').get('example');r.onsuccess=()=>ok(r.result);r.onerror=no});
  const before=localStorage.getItem('container-test');
  if(before!=='kept'){await new Promise((ok,no)=>{const t=db.transaction('values','readwrite');t.objectStore('values').put('kept','example');t.oncomplete=ok;t.onerror=no});localStorage.setItem('container-test','kept');db.close();location.reload();return;}
  const fetched=await fetch('index.html'),text=await fetched.text();
  const c=document.createElement('canvas'),gl=c.getContext('webgl');
  const result={origin:location.origin,localStorage:before==='kept',indexedDB:stored==='kept',fetch:fetched.ok&&text.includes('Native container test'),webgl:!!gl,glError:gl?gl.getError():null,bridge:!!window.webkit?.messageHandlers?.AtelierNative};
  result.pass=result.origin==='http://127.0.0.1:18781'&&result.localStorage&&result.indexedDB&&result.fetch&&result.webgl&&result.glError===0&&result.bridge;
  window.__containerSmoke=result;document.getElementById('status').textContent=JSON.stringify(result);db.close();
 }catch(e){window.__containerSmoke={pass:false,error:String(e)}}
})();
</script>
